name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # release notes need the history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Put the VS Installer on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      - name: Work out the version
        id: v
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/', '' }
                 else { '${{ github.event.inputs.tag }}' }
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '$tag' is not vMAJOR.MINOR.PATCH" }
          "tag=$tag"         | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Publish
        run: >
          dotnet publish src/Whisperkey/Whisperkey.csproj -c Release -warnaserror
          -p:Version=${{ steps.v.outputs.version }}
          -p:DebugType=none

      - name: Build the MSI
        run: >
          dotnet build installer/Whisperkey.wixproj -c Release
          -p:Version=${{ steps.v.outputs.version }}

      - name: Sign
        # Deliberately inert until signing secrets exist - see #25. Adding the
        # secrets turns this on; nothing here needs rewriting.
        if: ${{ env.AZURE_SIGN_CLIENT_ID != '' }}
        env:
          AZURE_SIGN_CLIENT_ID: ${{ secrets.AZURE_SIGN_CLIENT_ID }}
        shell: pwsh
        run: Write-Host "Signing secrets present; add the Trusted Signing step here."

      - name: Stage the release files
        shell: pwsh
        run: |
          $pub = "src/Whisperkey/bin/Release/net9.0-windows/win-x64/publish"
          New-Item -ItemType Directory -Force dist | Out-Null
          $tag = "${{ steps.v.outputs.tag }}"
          # The exe needs its native neighbours, so the zip is the real download.
          Compress-Archive -Path "$pub/*.exe","$pub/*.dll" -DestinationPath "dist/Whisperkey-$tag-win-x64.zip" -Force
          Copy-Item "installer/bin/x64/Release/Whisperkey.msi" "dist/Whisperkey-$tag-win-x64.msi"
          $lines = Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Release notes
        shell: pwsh
        run: |
          # The notes body lives in docs/release-notes-template.md rather than
          # inline. A PowerShell here-string has to start at column 0, which
          # breaks the YAML block scalar a run: step is written in - that made
          # this whole workflow unparseable, so every run failed in 0s with no
          # job and no log at all.
          $tag = "${{ steps.v.outputs.tag }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          $skip = '^- (chore|ci)[:( ]'
          $log = git log $range --pretty=format:'- %s' --no-merges | Where-Object { $_ -notmatch $skip }
          $nl = [Environment]::NewLine
          $body = Get-Content docs/release-notes-template.md -Raw
          $body = $body.Replace('__TAG__', $tag)
          $body = $body.Replace('__SUMS__', ((Get-Content dist/SHA256SUMS.txt) -join $nl))
          $body = $body.Replace('__CHANGES__', ($log -join $nl))
          $body | Out-File release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create "${{ steps.v.outputs.tag }}" $files `
            --title "Whisperkey ${{ steps.v.outputs.tag }}" `
            --notes-file release-notes.md
